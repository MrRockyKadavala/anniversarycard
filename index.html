.quiz{background:radial-gradient(circle at 50% 0,#fff7fa,#ffdce8 45%,#f1b9ca)}.quiz .q{border:1px solid #efc3d1;box-shadow:0 12px 30px #7b355020}.q{background:#fff;border-radius:16px;padding:17px;margin:14px 0;box-shadow:0 7px 20px #7b355016}.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:11px;border:1px solid #e6cbd5;background:#fff7fa;border-radius:11px}
.letter{background:radial-gradient(circle at 50% 10%,#fffdf5,#f5e5c7 75%,#e9d3a9)}.paper{background:#fffdf6;border-radius:7px;padding:25px 20px;box-shadow:0 12px 30px #51361c20;min-height:75%}.paper p{white-space:pre-wrap;line-height:1.7}

.previewBar{position:absolute;left:15px;right:15px;bottom:15px;display:flex;gap:8px}.previewBar button{flex:1;border:0;border-radius:12px;padding:10px;background:#ffffffdd;color:#6f3045;font-weight:700}

<style id="mobile-builder-layer">

nt-size:12px;line-height:1.45}.mobile-builder-view .field label{font-size:11px}.mobile-builder-view input,.mobile-builder-view textarea,.mobile-builder-view select{font-size:13px}.mobile-builder-view .actions{position:sticky;bottom:0;background:linear-gradient(transparent,#fff5f8 25%);padding-top:14px;z-index:4}.mobile-card-view{display:none;background:#100911}.phone-preview-inner{height:100%;position:relative}.phone-preview-inner .screen{height:100%;min-height:0;border-radius:0;overflow:auto}.mobile-card-view .mobile-template-nav{bottom:12px;right:10px}.mobile-card-view .mobile-template-nav button{font-size:11px;padding:8px 10px}@media(max-width:500px){.mobile-builder-shell{padding:0}.mobile-phone{width:100vw;height:100vh;min-height:0;border:0;border-radius:0}.mobile-phone-top{height:48px;flex-basis:48px}}

function go(i){
  i=Math.max(0,Math.min(6,Number(i)||0));
  S.tab=i;
  tabs();
  panels();
  render(i);
  updateMobileProgress();
  updateRecipientNav();
  requestAnimationFrame(()=>{
    const screen=document.querySelector('.screen');
    if(screen)screen.scrollTo({top:0,behavior:'auto'});
    updateRecipientNav();
  });
}
function replayStory(){S.tab=0;tabs();panels();render(0);updateMobileProgress();requestAnimationFrame(()=>{const screen=document.querySelector('.screen');if(screen)screen.scrollTo({top:0,behavior:'auto'});})}
function addPhotos(files){[...files].forEach(f=>{let r=new FileReader();r.onload=e=>{S.photos.push(e.target.result);render(2);panels()};r.readAsDataURL(f)})}
function removePhoto(i){S.photos.splice(i,1);render(2);panels()}
function addVideos(files){[...files].forEach(f=>{if(!f.type.startsWith('video/'))return;let r=new FileReader();r.onload=e=>{S.videos.push(e.target.result);render(2);panels()};r.readAsDataURL(f)})}
function removeVideo(i){S.videos.splice(i,1);render(2);panels()}
function addBackgroundMusic(files){const f=files&&files[0];if(!f)return;if(!f.type.startsWith('audio/')){alert('Please choose an audio file.');return}const r=new FileReader();r.onload=e=>{S.backgroundMusic=e.target.result;render(6);panels()};r.readAsDataURL(f)}
function removeBackgroundMusic(){S.backgroundMusic='';render(6);panels()}
function addMemoryPhoto(files,i){let f=files[0];if(!f)return;let r=new FileReader();r.onload=e=>{S.memories[i].photo=e.target.result;render(2);panels()};r.readAsDataURL(f)}
function petals(n=18){return Array.from({length:n},(_,i)=>`<span class="petal" style="left:${(i*37)%100}%;animation-delay:${(i%9)*.45}s">🌸</span>`).join('')}
function romanceDecor(){
  let p='';
  for(let i=0;i<28;i++)p+=`<span class="petalx" style="left:${(i*37)%101}%;animation-duration:${6+(i%6)}s;animation-delay:${-(i%8)*.7}s"></span>`;
  for(let i=0;i<9;i++)p+=`<span class="heartx" style="left:${(i*43)%100}%;top:${20+(i*17)%70}%;animation-delay:${-(i%7)}s">♥</span>`;
  for(let i=0;i<14;i++)p+=`<span class="sparkx" style="left:${(i*53)%100}%;top:${8+(i*29)%88}%;animation-delay:${-(i%9)*.3}s"></span>`;
  return `<div class="petals-layer">${p}</div>`;
}


function roseDecor(){
 return `<div class="rose-layer"><span class="rose r1">🌹</span><span class="rose r2">🌹</span><span class="rose r3">🌹</span><span class="rose r4">🌹</span><span class="rose r5">🌹</span></div>`;
}

function resetQuizState(){
  S.quizAnswers = {};
  S.quizPassed = false;
}
function normalizeQuizAnswer(v){
  return String(v??'').trim().toLowerCase().replace(/\s+/g,' ');
}
function answerQuiz(qi, value){
  const q=S.questions[qi];
  if(!q)return;
  let correct=false;
  if(q.type==='multiple'){
    correct=Number(value)===Number(q.ans);
  }else if(q.type==='truefalse'){
    correct=String(value).toLowerCase()===String(q.ans).toLowerCase();
  }else{
    correct=normalizeQuizAnswer(value)===normalizeQuizAnswer(q.ans);
  }
  S.quizAnswers=S.quizAnswers||{};
  S.quizAnswers[qi]=correct;
  S.quizPassed=S.questions.length>0 && S.questions.every((_,i)=>S.quizAnswers[i]===true);
  const feedback=document.getElementById('quizFeedback'+qi);
  if(feedback) feedback.textContent=correct?'❤️ Correct!':'Not quite — try again.';
  const qbox=document.querySelector('.q[data-q="'+qi+'"]');
  if(qbox) qbox.classList.toggle('quiz-correct',correct);
  const status=document.getElementById('quizStatus');
  if(status) status.textContent=S.quizPassed?'❤️ All correct — you may continue.':'Answer every question correctly to continue.';
  updateRecipientNav();
}
function updateRecipientNav(){
  const nav=document.getElementById('mobileTemplateNav');
  const prev=document.getElementById('templatePrev');
  const next=document.getElementById('templateNext');
  if(!nav||!prev||!next)return;
  const i=Number(S.tab)||0;
  nav.style.display='flex';
  nav.style.pointerEvents='auto';
  prev.disabled=i===0;
  if(i===3){
    next.disabled=S.quizPassed!==true;
    next.textContent=S.quizPassed===true?'Next →':'Locked 🔒';
  }else if(i===6){
    next.disabled=true;
    next.textContent='End';
  }else{
    next.disabled=false;
    next.textContent='Next →';
  }
}
function mobilePrev(){
  const i=Number(S.tab)||0;
  if(i>0) go(i-1);
}
function mobileNext(){
  const i=Number(S.tab)||0;
  if(i<0 || i>=6)return;
  if(i===3 && S.quizPassed!==true)return;
  const nextIndex=i+1;
  S.tab=nextIndex;
  // One transition path only: update state, switch to card mode, then render.
  showCardMode();
  requestAnimationFrame(()=>{
    const screen=document.getElementById('preview');
    if(screen){screen.scrollTop=0;screen.scrollLeft=0;}
    updateMobileProgress();
    updateRecipientNav();
  });
}

function localPreview(i){S.tab=i;render(i);alert('This is the live template preview. The phone on the right shows exactly what the recipient will see for this scene.')}
function wholePreview(){
  const preview=document.getElementById('preview');
  const whole=document.getElementById('whole');
  if(!preview||!whole)return;
  const savedHTML=preview.innerHTML;
  const savedTab=S.tab;
  const savedMode=document.getElementById('cardView')?.style.display||'';
  const scenes=[];
  try{
    for(let i=0;i<7;i++){
      render(i);
      scenes.push(preview.innerHTML || '');
    }
  }finally{
    S.tab=savedTab;
    preview.innerHTML=savedHTML;
    if(document.getElementById('cardView'))document.getElementById('cardView').style.display=savedMode;
    tabs(); panels(); updateMobileProgress(); updateRecipientNav();
  }
  whole.innerHTML=scenes.map((scene,i)=>`<div style="height:650px;margin:10px 0;border-radius:16px;overflow:hidden;border:1px solid #ead9df"><div style="height:100%;overflow:auto">${scene || '<div style="padding:20px">Template '+(i+1)+' is empty.</div>'}</div></div>`).join('');
  document.getElementById('modal').classList.add('open');
}
function sceneHTML(i){
  const preview=document.getElementById('preview');
  if(!preview)return '';
  const savedHTML=preview.innerHTML;
  const savedTab=S.tab;
  try{render(i);return preview.innerHTML || '';}
  finally{S.tab=savedTab;preview.innerHTML=savedHTML;}
}
function closeModal(ev){if(ev){ev.preventDefault();ev.stopPropagation();ev.stopImmediatePropagation()}const modal=document.getElementById('modal');if(modal){modal.classList.remove('open');modal.setAttribute('aria-hidden','true')}return false}
function closeModalBackground(ev){if(ev && ev.target===ev.currentTarget)closeModal(ev)}

let recognition=null;
function startVoice(){
  const status=document.getElementById('voiceStatus');
  const mic=document.getElementById('voiceMic');
  if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){
    if(status)status.textContent='Voice recognition is not supported. Please use Chrome or Edge.';
    return;
  }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();
  recognition.lang='en-US';
  recognition.interimResults=false;
  recognition.continuous=false;
  recognition.maxAlternatives=5;
  if(status)status.textContent='Listening… say “'+S.phrase+'” ❤️';
  if(mic)mic.textContent='🔴';
  recognition.onresult=e=>{
    const heard=Array.from(e.results[0]).map(x=>x.transcript).join(' ').toLowerCase().trim();
    const target=S.phrase.toLowerCase().trim();
    const normalize=s=>s.replace(/[.,!?']/g,'').replace(/\s+/g,' ');
    const h=normalize(heard), t=normalize(target);
    if(h===t || h.includes(t) || t.includes(h)){
      if(status)status.textContent='❤️ Recognised! Opening the anniversary reveal…';
      if(mic)mic.textContent='💖';
      recognition.stop();
      setTimeout(()=>{ S.tab=1; showCardMode(); updateMobileProgress(); updateRecipientNav(); requestAnimationFrame(()=>{const screen=document.getElementById('preview'); if(screen){screen.scrollTop=0;screen.scrollLeft=0;} updateRecipientNav();}); },450);
    }else{
      if(status)status.textContent='I heard “'+heard+'”. Try again.';
      if(mic)mic.textContent='🎙️';
    }
  };
  recognition.onerror=e=>{
    if(status)status.textContent=e.error==='not-allowed'?'Microphone permission was blocked. Allow it and try again.':'I could not hear that clearly. Try again.';
    if(mic)mic.textContent='🎙️';
  };
  recognition.onend=()=>{ if(mic && mic.textContent==='🔴')mic.textContent='🎙️'; };
  try{recognition.start()}catch(e){}
}


let mediaRecorder=null,recordedChunks=[],recordTimerInterval=null,recordStartedAt=0;
async function startRecording(){
 if(!navigator.mediaDevices?.getUserMedia){alert('Use Chrome or Edge for microphone recording.');return}
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  recordedChunks=[]; mediaRecorder=new MediaRecorder(stream);
  mediaRecorder.ondataavailable=e=>{if(e.data.size)recordedChunks.push(e.data)};
  mediaRecorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(recordedChunks,{type:mediaRecorder.mimeType||'audio/webm'});const r=new FileReader();r.onload=e=>{S.voiceNote=e.target.result;clearInterval(recordTimerInterval);render(6);panels()};r.readAsDataURL(blob)};
  mediaRecorder.start();recordStartedAt=Date.now();
  recordTimerInterval=setInterval(()=>{const s=Math.floor((Date.now()-recordStartedAt)/1000),el=document.getElementById('recordTimer');if(el)el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},250);
  const st=document.getElementById('recordStatus');if(st)st.textContent='🔴 Recording… speak your message.';
 }catch(e){alert('Microphone permission was not allowed. Please allow it and try again.')}
}
function stopRecording(){if(mediaRecorder?.state==='recording'){mediaRecorder.stop();clearInterval(recordTimerInterval);const st=document.getElementById('recordStatus');if(st)st.textContent='Processing your voice message…'}}
function removeVoice(){S.voiceNote='';render(6);panels()}
function addVoiceNote(files){
 const f=files&&files[0]; if(!f)return;
 if(!f.type.startsWith('audio/')){alert('Please choose an audio file.');return}
 const r=new FileReader();r.onload=e=>{S.voiceNote=e.target.result;render(6);panels()};r.readAsDataURL(f);
}

/* =========================
   SHORT-LINK CARD SYSTEM
   ========================= */
const ANNIVERCARD_CONFIG = {
  // Fill these two values from your Supabase project.
  // Never put a Supabase service-role key here. Use the anon/public key only.
  SUPABASE_URL: 'PASTE_YOUR_SUPABASE_PROJECT_URL_HERE',
  SUPABASE_ANON_KEY: 'PASTE_YOUR_SUPABASE_ANON_KEY_HERE',
  TEMPLATE_SLUG: 'anniversary'
};

let supabaseClient = null;

function supabaseReady(){
  return ANNIVERCARD_CONFIG.SUPABASE_URL.startsWith('http')
    && !ANNIVERCARD_CONFIG.SUPABASE_URL.includes('PASTE_')
    && ANNIVERCARD_CONFIG.SUPABASE_ANON_KEY.length > 20
    && !ANNIVERCARD_CONFIG.SUPABASE_ANON_KEY.includes('PASTE_');
}

function getSupabase(){
  if(!supabaseReady() || !window.supabase) return null;
  if(!supabaseClient){
    supabaseClient = window.supabase.createClient(
      ANNIVERCARD_CONFIG.SUPABASE_URL,
      ANNIVERCARD_CONFIG.SUPABASE_ANON_KEY
    );
  }
  return supabaseClient;
}

function randomShortId(len=7){
  const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  const bytes=new Uint8Array(len);
  crypto.getRandomValues(bytes);
  let s='';
  for(const b of bytes)s+=alphabet[b%alphabet.length];
  return s;
}

function getAppBase(){
  const p=location.pathname;
  if(p.endsWith('/index.html')) return location.origin + p.slice(0,-10);
  if(p.endsWith('/')) return location.origin + p.slice(0,-1);
  const i=p.lastIndexOf('/');
  return location.origin + (i>=0?p.slice(0,i):'');
}

function buildReceiverUrl(id){
  return getAppBase() + '/c/' + encodeURIComponent(id);
}

function buildTemplateUrl(){
  return getAppBase() + '/t/' + ANNIVERCARD_CONFIG.TEMPLATE_SLUG;
}

function dataUrlToBlob(dataUrl){
  const parts=dataUrl.split(',');
  const mime=(parts[0].match(/:(.*?);/)||[])[1] || 'application/octet-stream';
  const bin=atob(parts[1]||'');
  const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}

async function uploadDataUrl(client, dataUrl, folder, ext='bin'){
  if(!dataUrl || !dataUrl.startsWith('data:')) return dataUrl;
  const blob=dataUrlToBlob(dataUrl);
  const safeExt = (blob.type.split('/')[1] || ext).replace(/[^a-z0-9]/gi,'').slice(0,8) || ext;
  const path=folder+'/'+crypto.randomUUID()+'.'+safeExt;
  const {error}=await client.storage.from('card-media').upload(path, blob, {
    contentType:blob.type,
    upsert:false
  });
  if(error) throw error;
  const {data}=client.storage.from('card-media').getPublicUrl(path);
  return data.publicUrl;
}

async function prepareOnlinePayload(client, cardId){
  const payload=JSON.parse(JSON.stringify({...S,tab:0,quizAnswers:{},quizPassed:false}));
  payload.photos=await Promise.all((payload.photos||[]).map(x=>uploadDataUrl(client,x,cardId,'jpg')));
  payload.videos=await Promise.all((payload.videos||[]).map(x=>uploadDataUrl(client,x,cardId,'mp4')));
  payload.memories=await Promise.all((payload.memories||[]).map(async m=>({
    ...m,
    photo: await uploadDataUrl(client,m.photo,cardId,'jpg')
  })));
  payload.voiceNote=await uploadDataUrl(client,payload.voiceNote,cardId,'webm');
  payload.backgroundMusic=await uploadDataUrl(client,payload.backgroundMusic,cardId,'mp3');
  return payload;
}

async function createOnlineCard(){
  const client=getSupabase();
  if(!client){
    throw new Error('Supabase is not configured yet. Open SETUP.md and add the project URL and anon key to this HTML file.');
  }

  let id='';
  let lastError=null;

  for(let attempt=0;attempt<5;attempt++){
    id=randomShortId(7);
    const payload=await prepareOnlinePayload(client,id);
    const {error}=await client.from('cards').insert({
      id,
      template_slug:ANNIVERCARD_CONFIG.TEMPLATE_SLUG,
      payload
    });
    if(!error) return id;
    lastError=error;
    if(!String(error.message||'').toLowerCase().includes('duplicate')) break;
  }
  throw lastError || new Error('Could not create the card.');
}

async function generateReceiverLink(){
  const result=document.getElementById('receiverLinkResult');
  if(!result)return;

  result.innerHTML='<div class="mini">⏳ Saving your card and uploading photos/audio…</div>';

  try{
    const id=await createOnlineCard();
    const link=buildReceiverUrl(id);
    result.innerHTML=`
      <div class="short-link-result">
        <b>❤️ Your card is online</b>
        <input id="receiverLinkInput" readonly value="${esc(link)}">
        <div class="short-link-actions">
          <button class="secondary" type="button" onclick="copyReceiverLink()">📋 Copy</button>
          <button class="primary" type="button" onclick="shareReceiverLink()">📤 Share</button>
        </div>
        <div class="mini" style="margin-top:7px">Short receiver ID: <b>${esc(id)}</b></div>
      </div>`;
  }catch(e){
    console.error(e);
    result.innerHTML=`<div class="short-link-result">❌ ${esc(e.message||'Could not create the link.')}</div>`;
  }
}

async function copyReceiverLink(){
  const input=document.getElementById('receiverLinkInput');
  if(!input)return;
  try{
    await navigator.clipboard.writeText(input.value);
    const b=document.querySelector('#receiverLinkResult button');
    if(b)b.textContent='✓ Copied';
  }catch(e){
    input.select();
    document.execCommand('copy');
  }
}

async function shareReceiverLink(){
  const input=document.getElementById('receiverLinkInput');
  if(!input)return;
  if(navigator.share){
    try{await navigator.share({title:'A love card ❤️',url:input.value});}catch(e){}
  }else{
    copyReceiverLink();
  }
}

function pathParts(){
  return location.pathname.split('/').filter(Boolean);
}

async function enterReceiverMode(){
  const parts=pathParts();
  const cardIndex=parts.indexOf('c');
  const templateIndex=parts.indexOf('t');

  // /t/anniversary opens the creator customizer.
  if(templateIndex>=0){
    document.body.classList.remove('receiver-only');
    return false;
  }

  if(cardIndex<0 || !parts[cardIndex+1]) return false;

  const id=decodeURIComponent(parts[cardIndex+1]);
  const client=getSupabase();
  if(!client){
    document.body.innerHTML='<div style="font-family:system-ui;padding:30px;max-width:600px;margin:auto"><h2>Card setup required</h2><p>The card database is not configured yet.</p></div>';
    return true;
  }

  try{
    const {data,error}=await client.from('cards').select('payload').eq('id',id).single();
    if(error) throw error;
    if(!data?.payload) throw new Error('This card link does not exist.');

    S={...S,...data.payload,tab:0,quizAnswers:{},quizPassed:false};
    document.body.classList.add('receiver-only');
    const builder=document.getElementById('builderView'),card=document.getElementById('cardView');
    if(builder)builder.style.display='none';
    if(card)card.style.display='block';
    render(0); updateMobileProgress(); updateRecipientNav();
    return true;
  }catch(e){
    document.body.innerHTML='<div style="font-family:system-ui;padding:30px;max-width:600px;margin:auto;text-align:center"><h2>💔 Card not found</h2><p>This short link is invalid or the card has been removed.</p></div>';
    return true;
  }
}
