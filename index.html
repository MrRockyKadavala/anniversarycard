@keyframes heartFloat{0%{transform:translateY(20px) scale(.7);opacity:0}20%{opacity:.8}50%{transform:translateY(-80px) translateX(20px) scale(1)}100%{transform:translateY(-220px) translateX(-15px) scale(.6);opacity:0}}

content:"";position:absolute;top:-50px;width:20px;height:58px;background:inherit;border-radius:70% 70% 20% 20%;z-index:1}.bunny:before{left:7px;transform:rotate(-9deg)}.bunny:after{right:7px;transform:rotate(9deg)}

.bunny .cheek.left{left:2px}.bunny .cheek.right{right:2px}.male{left:31%;background:#e9e4e4}.female{left:52%;background:#f2d8e3}.suit{position:absolute;left:8px;right:8px;bottom:0;height:44px;background:#25252c;border-radius:0 0 22px 22px}.dress{position:absolute;left:-5px;right:-5px;bottom:0;height:50px;background:#e98eaf;border-radius:30px 30px 20px 20px}.flowers{position:absolute;left:5px;bottom:30px;font-size:25px}.bird{position:absolute;top:18%;font-size:24px;animation:fly 6s linear infinite}.b1{left:8%}.b2{left:65%;animation-delay:1.4s}.b3{left:35%;animation-delay:3s}@keyframes fly{50%{transform:translate(55px,22px)}100%{transform:translate(110px,-4px)}}.petal{position:absolute;top:-20px;font-size:17px;animation:fall 7s linear infinite}@keyframes fall{to{transform:translateY(900px) rotate(360deg);opacity:.1}}

.story{background:radial-gradient(circle at 20% 10%,#fff,#ffe9f1 42%,#f1cbd8);}.story .memory{border:1px solid #efc2d0;box-shadow:0 12px 28px #8d315022}.story .photoGrid img{box-shadow:0 8px 20px #71304725}.photoGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.photoGrid img{width:100%;height:145px;object-fit:cover;border-radius:14px}.timeline{border-left:2px solid #d7a1b4;margin:20px 0 0 9px;padding-left:18px}.memory{position:relative;background:#fff;border-radius:14px;padding:13px;margin:12px 0;box-shadow:0 5px 18px #7c3d4d18}.memory:before{content:"";position:absolute;left:-25px;top:17px;width:10px;height:10px;border-radius:50%;background:#a64969}
.quiz{background:radial-gradient(circle at 50% 0,#fff7fa,#ffdce8 45%,#f1b9ca)}.quiz .q{border:1px solid #efc3d1;box-shadow:0 12px 30px #7b355020}.q{background:#fff;border-radius:16px;padding:17px;margin:14px 0;box-shadow:0 7px 20px #7b355016}.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:11px;border:1px solid #e6cbd5;background:#fff7fa;border-radius:11px}
.letter{background:radial-gradient(circle at 50% 10%,#fffdf5,#f5e5c7 75%,#e9d3a9)}.paper{background:#fffdf6;border-radius:7px;padding:25px 20px;box-shadow:0 12px 30px #51361c20;min-height:75%}.paper p{white-space:pre-wrap;line-height:1.7}
.final{background:radial-gradient(circle at 50% 30%,#b84f70,#381525 70%);color:#fff}.finalHeart{font-size:75px;animation:pulse 1.8s infinite}@keyframes pulse{50%{transform:scale(1.12)}}@keyframes bunnyBreath{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-2px) rotate(-1deg)}50%{transform:translateY(-6px) rotate(0deg)}75%{transform:translateY(-2px) rotate(1deg)}}@keyframes bunnyLove{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.025)}}.surprise-bunny{position:relative;width:100%;height:145px;margin:6px auto 4px}.surprise-bunny .bunny{bottom:8px;transform-origin:50% 100%}.surprise-bunny .male{left:26%;animation:bunnyLove 2.6s ease-in-out infinite}.surprise-bunny .female{left:55%;animation:bunnyLove 2.9s ease-in-out .35s infinite}.surprise-bunny .love{position:absolute;left:50%;top:5px;transform:translateX(-50%);font-size:28px;animation:heartFloat 1.8s ease-in-out infinite;z-index:8}.surprise-bunny .flowerTrail{position:absolute;left:31%;bottom:18px;font-size:22px;letter-spacing:8px;animation:flowerSway 3s ease-in-out infinite;z-index:7}@keyframes heartFloat{0%,100%{transform:translate(-50%,0) scale(.9);opacity:.75}50%{transform:translate(-50%,-10px) scale(1.12);opacity:1}}@keyframes flowerSway{0%,100%{transform:translateX(0) rotate(-2deg)}50%{transform:translateX(5px) rotate(2deg)}}
.previewBar{position:absolute;left:15px;right:15px;bottom:15px;display:flex;gap:8px}.previewBar button{flex:1;border:0;border-radius:12px;padding:10px;background:#ffffffdd;color:#6f3045;font-weight:700}
.modal{position:fixed;inset:0;background:#170c1299;display:none;align-items:center;justify-content:center;padding:20px;z-index:100000;pointer-events:auto}.modal.open{display:flex}.modalBox{background:#fff;border-radius:20px;width:min(850px,96vw);height:min(90vh,850px);padding:14px;overflow:auto}.modalHead{display:flex;justify-content:space-between;align-items:center}.modalHead button{border:0;background:#f4e2e8;border-radius:9px;padding:8px}

<style id="mobile-builder-layer">

nt-size:12px;line-height:1.45}.mobile-builder-view .field label{font-size:11px}.mobile-builder-view input,.mobile-builder-view textarea,.mobile-builder-view select{font-size:13px}.mobile-builder-view .actions{position:sticky;bottom:0;background:linear-gradient(transparent,#fff5f8 25%);padding-top:14px;z-index:4}.mobile-card-view{display:none;background:#100911}.phone-preview-inner{height:100%;position:relative}.phone-preview-inner .screen{height:100%;min-height:0;border-radius:0;overflow:auto}.mobile-card-view .mobile-template-nav{bottom:12px;right:10px}.mobile-card-view .mobile-template-nav button{font-size:11px;padding:8px 10px}@media(max-width:500px){.mobile-builder-shell{padding:0}.mobile-phone{width:100vw;height:100vh;min-height:0;border:0;border-radius:0}.mobile-phone-top{height:48px;flex-basis:48px}}

<body>
<div class="mobile-builder-shell">

      <div class="mobile-tabs-wrap"><div class="tabs" id="tabs"></div></div>

    </div>
    <div id="cardView" class="mobile-card-view">
      <div class="phone-preview-inner"><div class="screen" id="preview"></div><div id="mobileTemplateNav" class="mobile-template-nav"><button type="button" class="prev" id="templatePrev" onclick="mobilePrev()">← Previous</button><button type="button" class="next" id="templateNext" onclick="mobileNext()">Next →</button></div></div>
    </div>
  </div>
</div>
<div class="modal" id="modal" onclick="closeModalBackground(event)"><div class="modalBox" onclick="event.stopPropagation()"><div class="modalHead"><b>👁 Whole-card preview</b><button type="button" onclick="closeModal(event)">Close</button></div><div id="whole"></div></div></div>

<script>
const labels=['🎙 Unlock','🐰 Reveal','📸 Story','💕 Quiz','💌 Letter','❤️ Finale','🎁 Surprise'];
let S={tab:0,name:'My Love',sender:'Your Bunny',opening:'I have a tiny challenge for you…',flirt:['Only you can unlock this.','Say it like you really mean it 😉','Come on, I’m listening…'],phrase:'I love you',
anniv:'Happy Anniversary ❤️',reveal:'A little surprise for the love of my life.',caption:'Our story begins again…',
story:'Every moment with you became one of my favourite memories. This is our little world — made from the moments only we understand.',
photos:[],memories:[{date:'2025',title:'The day we met',text:'The beginning of something beautiful.',photo:''}],
quizTitle:'How well do you know us?',questions:[{type:'multiple',q:'What is my favourite thing about you?',opts:['Your smile','Your kindness','Everything'],ans:2}],
letterTitle:'To the one I love',letter:'If I could keep one thing forever, it would be the feeling of being with you. Thank you for every laugh, every little moment, and every memory. Happy Anniversary ❤️',
final:'No matter where life takes us, I want to keep choosing you.',replay:'Replay our story',surpriseTitle:'There’s Another Surprise 💝',surpriseText:'One last little gift, just for you.',voiceNote:'',quizAnswers:{},quizPassed:false,voiceUnlocked:false};

function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function tabs(){const receiver=document.body.classList.contains('receiver-only');document.getElementById('tabs').innerHTML=labels.map((x,i)=>{const locked=receiver&&((i>=1&&!S.voiceUnlocked)||(i>=4&&!S.quizPassed));return `<button class="tab ${i===S.tab?'active':''}" ${locked?'disabled title="Locked until the previous challenge is completed"':''} onclick="${locked?'return false':`go(${i})`}">${x}${locked?' 🔒':''}</button>`}).join('')}
function field(label,key,type='input',extra=''){return `<div class="field"><label>${label}</label>${type==='textarea'?`<textarea ${extra} oninput="S.${key}=this.value;render(${S.tab})">${esc(S[key])}</textarea>`:`<input ${extra} value="${esc(S[key])}" oninput="S.${key}=this.value;render(${S.tab})">`}</div>`}
function panels(){
const p=[];
p.push(`<section class="panel ${S.tab===0?'active':''}"><h2>🎙 Voice Unlock</h2><div class="hint">Only ask for what this template needs. The recipient unlocks the next scene by saying the phrase.</div>${field('Recipient name','name')}${field('Sender name','sender')}${field('Opening text','opening','textarea')}${field('Voice phrase','phrase')}<div class="card"><div class="cardhead"><b>Flirty lines</b><span class="mini">${S.flirt.length} added</span></div>${S.flirt.map((x,i)=>`<div class="field"><div class="row" style="grid-template-columns:1fr auto;align-items:end"><input value="${esc(x)}" oninput="updateFlirtyLine(${i},this.value)"><button type="button" class="secondary" onclick="removeFlirtyLine(${i})">Remove</button></div></div>`).join('')}<button class="add" onclick="S.flirt.push('A new flirty line…');refreshBuilderSection(0)">＋ Add flirty line</button></div><div class="actions"><button class="primary" onclick="go(1)">Save & continue →</button><button class="secondary" onclick="localPreview(0)">Preview template</button></div></section>`);
p.push(`<section class="panel ${S.tab===1?'active':''}"><h2>🐰 Anniversary Reveal</h2><div class="hint">This scene is the cinematic bridge between the voice challenge and your story.</div>${field('Anniversary heading','anniv')}${field('Reveal message','reveal','textarea')}${field('Small caption','caption') }<div class="actions"><button class="secondary" onclick="go(0)">← Back</button><button class="primary" onclick="go(2)">Save & continue →</button><button class="secondary" onclick="localPreview(1)">Preview</button></div></section>`);
p.push(`<section class="panel ${S.tab===2?'active':''}"><h2>📸 Our Story + Memories</h2><div class="hint">Add your story first, then add photos and memories only when you want them.</div>${field('Our story','story','textarea')}<div class="card"><div class="cardhead"><b>Gallery</b><span class="mini">${S.photos.length} photos</span></div><div class="gallery-frame"><input type="file" accept="image/*" multiple onchange="addPhotos(this.files)"><div class="photoGrid">${S.photos.map((x,i)=>`<div class="photo-item"><img src="${x}"><button type="button" class="photo-remove" onclick="removeGalleryPhoto(${i})" title="Remove photo">×</button></div>`).join('')}</div></div></div><div class="card"><div class="cardhead"><b>Memories</b><span class="mini">${S.memories.length} added</span></div>${S.memories.map((m,i)=>`<div class="card"><div class="cardhead"><b>Memory ${i+1}</b><button type="button" class="secondary" onclick="removeMemory(${i})">Remove</button></div><div class="row"><div class="field"><label>Date / year</label><input value="${esc(m.date)}" oninput="updateMemoryField(${i},'date',this.value)"></div><div class="field"><label>Title</label><input value="${esc(m.title)}" oninput="updateMemoryField(${i},'title',this.value)"></div></div><div class="field"><label>Description</label><textarea oninput="updateMemoryField(${i},'text',this.value)">${esc(m.text)}</textarea></div><div class="field"><label>Memory photo (optional)</label><input type="file" accept="image/*" onchange="addMemoryPhoto(this.files,${i})">${m.photo?`<div style="margin-top:8px"><div class="mini">📷 Photo attached to this memory</div><img src="${m.photo}" style="display:block;width:100%;max-height:150px;object-fit:cover;border-radius:10px;margin-top:6px;border:2px solid #f0d4df"><button type="button" class="secondary remove-memory-photo" onclick="removeMemoryPhoto(${i})">🗑 Remove memory photo</button></div>`:''}</div></div>`).join('')}<button class="add" onclick="addMemory()">＋ Add a memory</button></div><div class="actions"><button class="secondary" onclick="go(1)">← Back</button><button class="primary" onclick="go(3)">Save & continue →</button><button class="secondary" onclick="localPreview(2)">Preview</button></div></section>`);
p.push(`<section class="panel ${S.tab===3?'active':''}"><h2>💕 Love Quiz</h2><div id="quizLockMessage" class="quiz-lock-note">Answer every question correctly to unlock the next template.</div><div class="hint">Create as many questions as you want. For Fill in the Blank and Short Answer, enter every accepted correct answer on a separate line.</div>${field('Quiz title','quizTitle')}<div class="card">${S.questions.map((q,i)=>`<div class="card"><div class="cardhead"><b>Question ${i+1}</b><button type="button" class="secondary" onclick="removeQuestion(${i})">Remove</button></div><div class="field"><label>Question type</label><select onchange="changeQuestionType(${i},this.value)"><option value="multiple" ${q.type==='multiple'?'selected':''}>Multiple Choice</option><option value="truefalse" ${q.type==='truefalse'?'selected':''}>True / False</option><option value="blank" ${q.type==='blank'?'selected':''}>Fill in the Blank</option><option value="short" ${q.type==='short'?'selected':''}>Short Answer</option></select></div><div class="field"><label>Question</label><textarea oninput="updateQuestionField(${i},'q',this.value)">${esc(q.q)}</textarea></div>${q.type==='multiple'?`<div class="field"><label>Answers (one per line)</label><textarea oninput="updateQuestionOptions(${i},this.value)">${esc((q.opts||[]).join('\n'))}</textarea><div class="quiz-answer-hint">The recipient chooses one of these answers.</div></div><div class="field"><label>Correct answer number</label><input type="number" min="1" max="${Math.max(1,(q.opts||[]).length)}" value="${(q.ans??0)+1}" oninput="updateQuestionNumberAnswer(${i},this.value)"></div>`:q.type==='truefalse'?`<div class="field"><label>Correct answer</label><select onchange="updateQuestionField(${i},'ans',this.value)"><option value="true" ${String(q.ans).toLowerCase()==='true'?'selected':''}>True</option><option value="false" ${String(q.ans).toLowerCase()==='false'?'selected':''}>False</option></select></div>`:`<div class="field"><label>Accepted correct answers — one per line</label><textarea placeholder="Enter one accepted answer per line. Example:
Paris France
parisfrance
PARIS  FRANCE" oninput="updateAcceptedAnswers(${i},this.value)">${esc((q.answers||((q.ans!==undefined&&q.ans!=='')?[q.ans]:[])).join('\n'))}</textarea><div class="quiz-answer-hint">Any one of these answers will be accepted. Add as many as you need.</div></div>`}</div>`).join('')}<button class="add" onclick="addQuestion()">＋ Add question</button></div><div class="actions"><button class="secondary" onclick="go(2)">← Back</button><button class="primary" onclick="go(4)">Save & continue →</button><button class="secondary" onclick="localPreview(3)">Preview</button></div></section>`);
p.push(`<section class="panel ${S.tab===4?'active':''}"><h2>💌 Personal Letter</h2><div class="hint">Just the heading and your letter. Nothing else.</div>${field('Letter heading','letterTitle')}${field('Your letter','letter','textarea')}<div class="actions"><button class="secondary" onclick="go(3)">← Back</button><button class="primary" onclick="go(5)">Save & continue →</button><button class="secondary" onclick="localPreview(4)">Preview</button></div></section>`);
p.push(`<section class="panel ${S.tab===5?'active':''}"><h2>❤️ Final Scene</h2><div class="hint">The last message the recipient sees.</div>${field('Final message','final','textarea')}<div class="actions"><button class="secondary" onclick="go(4)">← Back</button><button class="primary" onclick="go(6)">Save & continue →</button><button class="secondary" onclick="localPreview(5)">Preview</button></div></section>`);
p.push(`<section class="panel ${S.tab===6?'active':''}">
<h2>🎁 Another Surprise</h2>
<div class="hint">This is the next template after the Final Message. Add everything for this scene here, just like the other templates.</div>
${field('Surprise heading','surpriseTitle')}
${field('Surprise message','surpriseText','textarea')}
<div class="card">
<div class="cardhead"><b>🎙️ Voice message</b><span class="mini">${S.voiceNote?'Added':'Not added'}</span></div>
<div class="hint">Record your personal message here. The recording is saved into this card and will be playable by the recipient in this template.</div>
<div class="row" style="margin-top:12px">
<button class="primary" onclick="startRecording()">🔴 Start recording</button>
<button class="secondary" onclick="stopRecording()">⏹ Stop</button>
</div>
<div id="recordTimer" class="mini" style="margin-top:8px">00:00</div>
<div id="recordStatus" class="mini" style="margin-top:6px">${S.voiceNote?'✅ Voice message added.':'No voice message added yet.'}</div>
${S.voiceNote?`<audio controls src="${S.voiceNote}" style="width:100%;margin-top:10px"></audio><button class="add" style="margin-top:8px" onclick="removeVoice()">🗑 Remove voice message</button>`:''}
<div class="field"><label>Or upload an existing voice recording</label><input type="file" accept="audio/*" onchange="addVoiceNote(this.files)"></div>
</div>
<div class="receiver-link-card">
  <b>🔗 Ready to send?</b>
  <p class="hint">Generate a receiver link when all your details are finished. The receiver link opens the card only — the builder and editing controls are hidden.</p>
  <button class="primary" type="button" onclick="generateReceiverLink()">🔗 Generate receiver link</button>
  <div id="receiverLinkResult" class="receiver-link-result"></div>
</div>
<div class="actions">
<button class="secondary" onclick="go(5)">← Back</button>
<button class="primary" onclick="wholePreview()">👁 Preview whole card</button>
<button class="secondary" onclick="localPreview(6)">Preview this template</button>
</div>
</section>`);
document.getElementById('panels').innerHTML=p.join('')}
function go(i){
  i=Math.max(0,Math.min(6,Number(i)||0));
  if(document.body.classList.contains('receiver-only')){if(i>=1 && S.voiceUnlocked!==true)return;if(i>=4 && S.quizPassed!==true)return;}
  S.tab=i;
  tabs();
  panels();
  render(i);
  updateMobileProgress();
  updateRecipientNav();
  requestAnimationFrame(()=>{
    const screen=document.querySelector('.screen');
    if(screen)screen.scrollTo({top:0,behavior:'auto'});
    updateRecipientNav();
  });
}
function replayStory(){S.tab=0;tabs();panels();render(0);updateMobileProgress();requestAnimationFrame(()=>{const screen=document.querySelector('.screen');if(screen)screen.scrollTo({top:0,behavior:'auto'});})}
function refreshBuilderSection(i){S.tab=i;tabs();panels();render(i);updateMobileProgress();requestAnimationFrame(()=>{const p=document.getElementById('panels');if(p)p.scrollTop=p.scrollTop;});}
function addPhotos(files){[...files].forEach(f=>{let r=new FileReader();r.onload=e=>{S.photos.push(e.target.result);refreshBuilderSection(2)};r.readAsDataURL(f)})}
function removeGalleryPhoto(i){if(i<0||i>=S.photos.length)return;S.photos.splice(i,1);refreshBuilderSection(2)}
function addMemory(){S.memories.push({date:'',title:'',text:'',photo:''});refreshBuilderSection(2);requestAnimationFrame(()=>{const p=document.getElementById('panels');if(p)p.scrollTop=p.scrollHeight;});}
function addMemoryPhoto(files,i){let f=files&&files[0];if(!f)return;let r=new FileReader();r.onload=e=>{if(S.memories[i])S.memories[i].photo=e.target.result;refreshBuilderSection(2)};r.readAsDataURL(f)}
function removeMemoryPhoto(i){if(S.memories[i]){S.memories[i].photo='';refreshBuilderSection(2)}}
function removeMemory(i){if(i<0||i>=S.memories.length)return;if(S.memories.length===1){S.memories[0]={date:'',title:'',text:'',photo:''};}else{S.memories.splice(i,1)}refreshBuilderSection(2)}
function addQuestion(){S.questions.push({type:'multiple',q:'',opts:['',''],ans:0,answers:[]});S.quizAnswers={};S.quizPassed=false;refreshBuilderSection(3);requestAnimationFrame(()=>{const p=document.getElementById('panels');if(p)p.scrollTop=p.scrollHeight;});}
function removeQuestion(i){if(i<0||i>=S.questions.length)return;S.questions.splice(i,1);S.quizAnswers={};S.quizPassed=false;refreshBuilderSection(3)}
function changeQuestionType(i,type){const q=S.questions[i];if(!q)return;q.type=type;if(type==='multiple'){q.opts=Array.isArray(q.opts)&&q.opts.length?q.opts:['',''];q.ans=Number.isFinite(Number(q.ans))?Number(q.ans):0;}else if(type==='truefalse'){q.ans=String(q.ans).toLowerCase()==='false'?'false':'true';}else{q.answers=Array.isArray(q.answers)&&q.answers.length?q.answers:(q.ans!==undefined&&q.ans!==''?[String(q.ans)]:['']);q.ans=q.answers[0]||'';}S.quizAnswers={};S.quizPassed=false;refreshBuilderSection(3)}
function updateMemoryField(i,key,value){if(S.memories[i])S.memories[i][key]=value}
function updateQuestionField(i,key,value){if(S.questions[i])S.questions[i][key]=value}
function updateFlirtyLine(i,value){if(S.flirt[i]!==undefined)S.flirt[i]=value}
function removeFlirtyLine(i){if(i<0||i>=S.flirt.length)return;if(S.flirt.length===1)S.flirt[0]='';else S.flirt.splice(i,1);refreshBuilderSection(0)}
function updateQuestionOptions(i,value){if(S.questions[i])S.questions[i].opts=value.split(/\r?\n/)}
function updateQuestionNumberAnswer(i,value){if(S.questions[i])S.questions[i].ans=Math.max(0,Number(value||1)-1)}
function updateAcceptedAnswers(i,value){if(S.questions[i]){S.questions[i].answers=value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);S.questions[i].ans=S.questions[i].answers[0]||''}}
function petals(n=18){return Array.from({length:n},(_,i)=>`<span class="petal" style="left:${(i*37)%100}%;animation-delay:${(i%9)*.45}s">🌸</span>`).join('')}
function romanceDecor(){
  let p='';
  for(let i=0;i<28;i++)p+=`<span class="petalx" style="left:${(i*37)%101}%;animation-duration:${6+(i%6)}s;animation-delay:${-(i%8)*.7}s"></span>`;
  for(let i=0;i<9;i++)p+=`<span class="heartx" style="left:${(i*43)%100}%;top:${20+(i*17)%70}%;animation-delay:${-(i%7)}s">♥</span>`;
  for(let i=0;i<14;i++)p+=`<span class="sparkx" style="left:${(i*53)%100}%;top:${8+(i*29)%88}%;animation-delay:${-(i%9)*.3}s"></span>`;
  return `<div class="petals-layer">${p}</div>`;
}


function roseDecor(){
 return `<div class="rose-layer"><span class="rose r1">🌹</span><span class="rose r2">🌹</span><span class="rose r3">🌹</span><span class="rose r4">🌹</span><span class="rose r5">🌹</span></div>`;
}

function resetQuizState(){
  S.quizAnswers = {};
  S.quizPassed = false;
  tabs();
  updateRecipientNav();
}
function normalizeQuizAnswer(v){
  return String(v??'').toLowerCase().replace(/[^a-z0-9]/g,'');
}
function answerQuiz(qi, value){
  const q=S.questions[qi];
  if(!q)return;
  let correct=false;
  if(q.type==='multiple'){
    correct=Number(value)===Number(q.ans);
  }else if(q.type==='truefalse'){
    correct=String(value).toLowerCase()===String(q.ans).toLowerCase();
  }else{
    const accepted=Array.isArray(q.answers)&&q.answers.length?q.answers:(q.ans!==undefined&&q.ans!==''?[q.ans]:[]);
    const userAnswer=normalizeQuizAnswer(value);
    correct=!!userAnswer && accepted.some(a=>userAnswer===normalizeQuizAnswer(a));
  }
  S.quizAnswers=S.quizAnswers||{};
  S.quizAnswers[qi]=correct;
  S.quizPassed=S.questions.length>0 && S.questions.every((_,i)=>S.quizAnswers[i]===true);
  const feedback=document.getElementById('quizFeedback'+qi);
  if(feedback) feedback.textContent=correct?'❤️ Correct!':'Not quite — try again.';
  const qbox=document.querySelector('.q[data-q="'+qi+'"]');
  if(qbox) qbox.classList.toggle('quiz-correct',correct);
  const status=document.getElementById('quizStatus');
  if(status) status.textContent=S.quizPassed?'❤️ All correct — you may continue.':'Answer every question correctly to continue.';
  tabs();
  updateRecipientNav();
}
function updateRecipientNav(){
  const nav=document.getElementById('mobileTemplateNav');
  const prev=document.getElementById('templatePrev');
  const next=document.getElementById('templateNext');
  if(!nav||!prev||!next)return;
  const i=Number(S.tab)||0;
  nav.style.display='flex';
  nav.style.pointerEvents='auto';
  prev.disabled=i===0;
  if(i===0){next.disabled=S.voiceUnlocked!==true;next.textContent=S.voiceUnlocked===true?'Next →':'Locked 🔒';}
  else if(i===3){next.disabled=S.quizPassed!==true;next.textContent=S.quizPassed===true?'Next →':'Locked 🔒';}
  else if(i===6){next.disabled=true;next.textContent='End';}
  else{next.disabled=false;next.textContent='Next →';}
}
function mobilePrev(){
  const i=Number(S.tab)||0;
  if(i>0) go(i-1);
}
function mobileNext(){
  const i=Number(S.tab)||0;
  if(i<0 || i>=6)return;
  if(i===0 && S.voiceUnlocked!==true)return;
  if(i===3 && S.quizPassed!==true)return;
  const nextIndex=i+1;
  S.tab=nextIndex;
  // One transition path only: update state, switch to card mode, then render.
  showCardMode();
  requestAnimationFrame(()=>{
    const screen=document.getElementById('preview');
    if(screen){screen.scrollTop=0;screen.scrollLeft=0;}
    updateMobileProgress();
    updateRecipientNav();
  });
}

function render(i){
let h='';
if(i===0)h=`<div class="scene voice center">${romanceDecor()}${roseDecor()}<div class="romantic-content"><div class="eyebrow">A tiny challenge for</div><div class="title">${esc(S.name)}</div><div class="heart">💗</div><p>${esc(S.opening)}</p>${S.flirt.map(x=>`<div class="pill" style="margin:4px">${esc(x)}</div>`).join('')}<button class="mic" id="voiceMic" onclick="startVoice()">🎙️</button><div class="tiny" id="voiceStatus">Tap the mic, then say: “${esc(S.phrase)}”</div></div></div></div>`;
if(i===1)h=`<div class="scene reveal">${romanceDecor()}${roseDecor()}${petals(10)}<div class="reveal-copy"><div class="annivGlow"><div class="annivBig">${esc(S.anniv)}</div><h2>${esc(S.reveal)}</h2><p>${esc(S.caption)}</p></div></div><div class="mount"></div><div class="land"></div><div class="river"></div><div class="tree l"></div><div class="tree r"></div><div class="house"><div class="roof"></div></div><div class="bird b1">🕊️</div><div class="bird b2">🕊️</div><div class="bird b3">🕊️</div><div class="bunny male"><div class="earinner left"></div><div class="earinner right"></div><div class="face"><i class="eye left"></i><i class="eye right"></i><i class="nose"></i><i class="mouth"></i><i class="cheek left"></i><i class="cheek right"></i></div><div class="suit"></div><div class="flowers">💐</div></div><div class="bunny female"><div class="earinner left"></div><div class="earinner right"></div><div class="face"><i class="eye left"></i><i class="eye right"></i><i class="nose"></i><i class="mouth"></i><i class="cheek left"></i><i class="cheek right"></i></div><div class="dress"></div></div></div>`;

if(i===2)h=`<div class="scene story">${romanceDecor()}${roseDecor()}<div class="romantic-content">${petals(12)}<div class="center" style="position:relative"><div class="eyebrow">Our story</div><h1>${esc(S.name)} & ${esc(S.sender)}</h1><p>${esc(S.story)}</p></div><div class="gallery-frame"><div class="photoGrid">${S.photos.map(x=>`<img src="${x}">`).join('')}</div></div><div class="timeline-wrap"><div class="timeline-entry">${S.memories.map(m=>`<div class="memory"><b>${esc(m.date)} · ${esc(m.title)}</b><p>${esc(m.text)}</p>${m.photo?`<img src="${m.photo}" style="width:100%;border-radius:10px">`:''}</div>`).join('')}</div><div class="timeline-ending"><b>✨ And now, the next chapter begins</b><span>Every memory brought you here — and there is still more to discover.</span></div></div></div></div>`;

if(i===4)h=`<div class="scene letter">${romanceDecor()}${roseDecor()}<div class="romantic-content"><div class="paper"><div class="eyebrow">A letter for you</div><h1>${esc(S.letterTitle)}</h1><p>${esc(S.letter)}</p><div style="text-align:right;font-size:30px">♡</div></div></div></div>`;

let recognition=null;
function startVoice(){
  const status=document.getElementById('voiceStatus');
  const mic=document.getElementById('voiceMic');
  if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){
    if(status)status.textContent='Voice recognition is not supported. Please use Chrome or Edge.';
    return;
  }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();
  recognition.lang='en-US';
  recognition.interimResults=false;
  recognition.continuous=false;
  recognition.maxAlternatives=5;
  if(status)status.textContent='Listening… say “'+S.phrase+'” ❤️';
  if(mic)mic.textContent='🔴';
  recognition.onresult=e=>{
    const heard=Array.from(e.results[0]).map(x=>x.transcript).join(' ').toLowerCase().trim();
    const target=S.phrase.toLowerCase().trim();
    const normalize=s=>s.replace(/[.,!?']/g,'').replace(/\s+/g,' ');
    const h=normalize(heard), t=normalize(target);
    if(h===t || h.includes(t) || t.includes(h)){
      if(status)status.textContent='❤️ Recognised! Opening the anniversary reveal…';
      if(mic)mic.textContent='💖';
      S.voiceUnlocked=true;
      tabs();
      updateRecipientNav();
      recognition.stop();
      setTimeout(()=>{ S.tab=1; showCardMode(); updateMobileProgress(); updateRecipientNav(); requestAnimationFrame(()=>{const screen=document.getElementById('preview'); if(screen){screen.scrollTop=0;screen.scrollLeft=0;} updateRecipientNav();}); },450);
    }else{
      if(status)status.textContent='I heard “'+heard+'”. Try again.';
      if(mic)mic.textContent='🎙️';
    }
  };
  recognition.onerror=e=>{
    if(status)status.textContent=e.error==='not-allowed'?'Microphone permission was blocked. Allow it and try again.':'I could not hear that clearly. Try again.';
    if(mic)mic.textContent='🎙️';
  };
  recognition.onend=()=>{ if(mic && mic.textContent==='🔴')mic.textContent='🎙️'; };
  try{recognition.start()}catch(e){}
}


let mediaRecorder=null,recordedChunks=[],recordTimerInterval=null,recordStartedAt=0;
async function startRecording(){
 if(!navigator.mediaDevices?.getUserMedia){alert('Use Chrome or Edge for microphone recording.');return}
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  recordedChunks=[]; mediaRecorder=new MediaRecorder(stream);
  mediaRecorder.ondataavailable=e=>{if(e.data.size)recordedChunks.push(e.data)};
  mediaRecorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(recordedChunks,{type:mediaRecorder.mimeType||'audio/webm'});const r=new FileReader();r.onload=e=>{S.voiceNote=e.target.result;clearInterval(recordTimerInterval);render(6);panels()};r.readAsDataURL(blob)};
  mediaRecorder.start();recordStartedAt=Date.now();
  recordTimerInterval=setInterval(()=>{const s=Math.floor((Date.now()-recordStartedAt)/1000),el=document.getElementById('recordTimer');if(el)el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},250);
  const st=document.getElementById('recordStatus');if(st)st.textContent='🔴 Recording… speak your message.';
 }catch(e){alert('Microphone permission was not allowed. Please allow it and try again.')}
}
function stopRecording(){if(mediaRecorder?.state==='recording'){mediaRecorder.stop();clearInterval(recordTimerInterval);const st=document.getElementById('recordStatus');if(st)st.textContent='Processing your voice message…'}}

 const f=files&&files[0]; if(!f)return;
 if(!f.type.startsWith('audio/')){alert('Please choose an audio file.');return}
 const r=new FileReader();r.onload=e=>{S.voiceNote=e.target.result;render(6);panels()};r.readAsDataURL(f);
}
function encodeReceiverState(){
  const payload={...S,tab:0,quizAnswers:{},quizPassed:false};
  const json=JSON.stringify(payload);
  const bytes=new TextEncoder().encode(json);
  let binary=''; for(const b of bytes)binary+=String.fromCharCode(b);
  return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeReceiverState(token){
  try{
    const base=token.replace(/-/g,'+').replace(/_/g,'/');
    const binary=atob(base+'='.repeat((4-base.length%4)%4));
    const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }catch(e){return null}
}
async function optimizeImageDataUrl(dataUrl){
  if(!dataUrl || !String(dataUrl).startsWith('data:image/')) return dataUrl;
  const src=String(dataUrl);
  try{
    const img=new Image();
    await new Promise((resolve,reject)=>{
      img.onload=resolve;
      img.onerror=reject;
      img.src=src;
    });
    const maxSide=1600;
    const scale=Math.min(1,maxSide/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
    const w=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));
    const h=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
    const canvas=document.createElement('canvas');
    canvas.width=w; canvas.height=h;
    const ctx=canvas.getContext('2d',{alpha:false});
    if(!ctx)return src;
    ctx.drawImage(img,0,0,w,h);
    const compressed=canvas.toDataURL('image/jpeg',0.80);
    return compressed.length<src.length?compressed:src;
  }catch(e){
    return src;
  }
}

async function uploadNetlifyMedia(dataUrl,onProgress){
  if(!dataUrl || !String(dataUrl).startsWith('data:')) return dataUrl;
  let source=String(dataUrl);
  if(source.startsWith('data:image/')) source=await optimizeImageDataUrl(source);
  const m=source.match(/^data:([^;,]+)(?:;[^,]*)?,(.*)$/s);
  if(!m) return source;
  const mime=m[1] || 'application/octet-stream';
  let binary;
  try{binary=atob(m[2]);}catch(e){throw new Error('Could not read one of the selected media files.');}
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);

  let lastError=null;
  for(let attempt=1;attempt<=3;attempt++){
    const key=crypto.randomUUID().replace(/-/g,'')+Math.random().toString(36).slice(2,8);
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),60000);
    try{
      onProgress?.(attempt===1?'Uploading media…':'Retrying media upload…');
      const r=await fetch('/api/media/'+key,{method:'POST',headers:{'Content-Type':mime,'Cache-Control':'no-cache'},body:bytes,signal:controller.signal});
      if(!r.ok){
        const detail=(await r.text()) || ('Media upload failed ('+r.status+')');
        if(r.status===413) throw new Error('This photo is still too large after compression. Please choose a smaller photo.');
        throw new Error(detail);
      }
      onProgress?.('Media uploaded');
      return '/api/media/'+key;
    }catch(e){
      lastError=e;
      if(e?.name==='AbortError') lastError=new Error('Media upload timed out. Retrying…');
      if(attempt<3) await new Promise(resolve=>setTimeout(resolve,1000*attempt));
    }finally{clearTimeout(timer)}
  }
  throw new Error(lastError?.message||'Media upload failed. Please try again.');
}
async function prepareNetlifyPayload(progress){
  const payload=JSON.parse(JSON.stringify({...S,tab:0,quizAnswers:{},quizPassed:false}));
  const jobs=[];
  if(Array.isArray(payload.photos)){
    payload.photos.forEach((photo,i)=>{
      if(photo) jobs.push({label:'Gallery photo '+(i+1),run:async()=>{payload.photos[i]=await uploadNetlifyMedia(photo,()=>progress?.('Uploading gallery photo '+(i+1)+'…'))}});
    });
  }
  if(Array.isArray(payload.memories)){
    payload.memories.forEach((m,i)=>{
      if(m && m.photo) jobs.push({label:'Memory photo '+(i+1),run:async()=>{m.photo=await uploadNetlifyMedia(m.photo,()=>progress?.('Uploading memory photo '+(i+1)+'…'))}});
    });
  }
  if(payload.voiceNote) jobs.push({label:'Voice message',run:async()=>{payload.voiceNote=await uploadNetlifyMedia(payload.voiceNote,()=>progress?.('Uploading voice message…'))}});
  let done=0;
  const total=jobs.length;
  if(!total){progress?.('No media to upload. Creating your link…');return payload;}
  progress?.('Uploading 0 of '+total+' media files…');
  // Upload one file at a time to avoid mobile/network throttling when many photos are selected.
  for(const job of jobs){
    await job.run();
    done++;
    progress?.('Uploading '+done+' of '+total+' media files…');
  }
  return payload;
}

function makeCardId(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  let id=''; for(let i=0;i<7;i++) id+=chars[Math.floor(Math.random()*chars.length)];
  return id;
}
async function generateReceiverLink(){
  const result=document.getElementById('receiverLinkResult');
  if(!result)return;
  const btn=document.querySelector('.receiver-link-card button.primary');
  if(btn){btn.disabled=true;btn.textContent='⏳ Creating link…';}
  result.innerHTML='<div class="mini">⏳ Preparing your card…</div>';
  try{
    const id=makeCardId();
    const payload=await prepareNetlifyPayload(msg=>{result.innerHTML='<div class="mini">⏳ '+esc(msg)+'</div>';});
    result.innerHTML='<div class="mini">⏳ Saving your card online…</div>';
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),30000);
    let r;
    try{
      r=await fetch('/api/cards/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({payload}),signal:controller.signal});
    }catch(e){
      if(e?.name==='AbortError') throw new Error('Saving the card timed out after 30 seconds. Please try again.');
      throw e;
    }finally{clearTimeout(timer)}
    if(!r.ok) throw new Error(await r.text() || ('Could not save card ('+r.status+')'));
    const link=location.origin+'/c/'+id;
    result.innerHTML=`<input id="receiverLinkInput" readonly value="${esc(link)}"><button class="secondary" type="button" onclick="copyReceiverLink()">📋 Copy receiver link</button><div class="mini" style="margin-top:6px">✓ Saved online. The receiver link opens only the finished card.</div>`;
  }catch(e){
    console.error(e);
    result.innerHTML=`<div class="mini" style="color:#a51f45">❌ ${esc(e.message||'Could not create receiver link')}</div><button class="secondary" type="button" onclick="generateReceiverLink()" style="margin-top:8px">↻ Try again</button>`;
  }finally{
    if(btn){btn.disabled=false;btn.textContent='🔗 Generate receiver link';}
  }
}
function copyReceiverLink(){
  const input=document.getElementById('receiverLinkInput');
  if(!input)return;
  input.select(); input.setSelectionRange(0,input.value.length);
  try{navigator.clipboard?.writeText(input.value).then(()=>{const b=document.querySelector('#receiverLinkResult button');if(b)b.textContent='✓ Copied';}).catch(()=>document.execCommand('copy'));}catch(e){try{document.execCommand('copy')}catch(_){} }
}
async function enterReceiverMode(){
  const match=location.pathname.match(/^\/c\/([A-Za-z0-9]{7})\/?$/);
  if(match){
    try{
      const r=await fetch('/api/cards/'+match[1],{cache:'no-store'});
      if(!r.ok) return false;
      const data=await r.json();
      S={...S,...data,tab:0,quizAnswers:{},quizPassed:false,voiceUnlocked:false};
      document.body.classList.add('receiver-only');
      const builder=document.getElementById('builderView'),card=document.getElementById('cardView');
      if(builder)builder.style.display='none';
      if(card)card.style.display='block';
      render(0); updateMobileProgress(); updateRecipientNav();
      return true;
    }catch(e){ console.error(e); return false; }
  }
  const token=location.hash.startsWith('#receiver=')?location.hash.slice(10):'';
  if(!token)return false;
  const data=decodeReceiverState(token);
  if(!data)return false;
  S={...S,...data,tab:0,quizAnswers:{},quizPassed:false,voiceUnlocked:false};
  document.body.classList.add('receiver-only');
  const builder=document.getElementById('builderView'),card=document.getElementById('cardView');
  if(builder)builder.style.display='none';
  if(card)card.style.display='block';
  render(0); updateMobileProgress(); updateRecipientNav();
  return true;
}
